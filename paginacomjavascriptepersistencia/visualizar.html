<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Visualizar Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="card p-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Lista de Usuários</h2>
        <a href="index.html" class="btn btn-outline-secondary">Voltar ao Cadastro</a>
      </div>

      <div id="listaUsuarios" class="mt-3"></div>
    </div>
  </div>

  <script>
    // Carrega usuários do localStorage
    const listaDiv = document.getElementById("listaUsuarios");
    const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    if (usuarios.length === 0) {
      listaDiv.innerHTML = '<div class="alert alert-warning">Nenhum usuário cadastrado.</div>';
    } else {
      const lista = usuarios.map((u, i) => `
        <div class="border-bottom py-2">
          <strong>${i + 1}. ${u.nome}</strong> — ${u.idade} anos <br>
          <small>${u.email}</small>
        </div>
      `).join("");
      listaDiv.innerHTML = lista;
    }
  </script>
</body>
</html>
