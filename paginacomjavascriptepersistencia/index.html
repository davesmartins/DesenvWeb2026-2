<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container">
    <div class="card p-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cadastro de Usuário</h2>
        <a href="visualizar.html" class="btn btn-outline-primary">Visualizar Usuários</a>
      </div>

      <form id="formCadastro">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="exemplo@dominio.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Idade</label>
          <input type="number" class="form-control" id="idade" placeholder="Digite sua idade">
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </form>

      <div id="resultado" class="mt-3"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
