<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<h1>CSS Position (Exemplo Didático)</h1>
  <p>propriedade position</p>

  <div class="box">Position I</div>
  <div class="box red" 
  style="position: absolute; bottom: 15px; right: 15px;
  border-radius: 50%;">
    Position II
</div>
  <div class="box blue"
  style="top: 50px; left: 50px;">
  Position III
</div>

<div  class="blue"
style="position: relative; 
left: 50px; border-width: 2px;">
    <p>Posição relativa</p>
    <div class="box"
    style="position: absolute; top: 50px; left: 50px;">
        Posiiton IV
    </div>
    <div class="box"
    style="position: fixed; top: 15px; left: 15px;">
        Posiiton V
    </div>
</div>



</body>
</html>
