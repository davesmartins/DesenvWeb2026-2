<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Simples - Grid e Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 
  <div class="titulo-exemplo">Layout Geral da Página (CSS Grid) + Menu (Flexbox)</div>
  
  <div class="grid-pagina">
    <header class="topo">
      
      <div class="logo"></div>

      <nav class="menu-navegacao">
        <ul>
          <li>A</li>
          <li>B</li>
          <li>C</li>
          <li>D</li>
        </ul>
      </nav>
    
      <div class="botao-perfil"></div>

    </header>

    <!-- Sidebar Lateral -->
    <aside class="sidebar-esquerda">
      
      <nav class="mn-lateral">
        <ul>
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
          <li>Item 4</li>
        </ul>
      </nav>

    </aside>

    <!-- Conteúdo Principal -->
    <main class="conteudo-principal"></main>

    <!-- Sidebar Direita -->
    <aside class="sidebar-direita"></aside>

    <!-- Rodapé -->
    <footer class="rodape"></footer>
  </div>


  <!-- EXEMPLO 2: CARDS E BARRA SEPARADA COM FLEXBOX -->
  <div class="titulo-exemplo">Cards Responsivos em Linha (Flexbox)</div>
  
  <div class="flex-cards">
    <div class="card card-1"></div>
    <div class="card card-2"></div>
    <div class="card card-3"></div>
    <div class="card card-4"></div>
  </div>

</body>
</html>
